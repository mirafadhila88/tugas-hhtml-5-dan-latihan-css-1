<!DOCTYPE html>
<html>
<head>
    <title>Form Contact</title>
</head>
<body>

    <h2>Form Contact</h2>

    <form>
        <fieldset>
            <legend>Contact</legend>
            <table>
                <tr>
                    <td>Nama:</td>
                    <td><input type="text" name="nama" placeholder="Masukkan nama"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" name="email" placeholder="Masukkan email"></td>
                </tr>
                <tr>
                    <td>Subject:</td>
                    <td><input type="text" name="subject" placeholder="Masukkan subject"></td>
                </tr>
                <tr>
                    <td>Pesan:</td>
                    <td><textarea name="pesan" rows="4" cols="30" placeholder="Tulis pesan Anda..."></textarea></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Send">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>

</body>
</html>
