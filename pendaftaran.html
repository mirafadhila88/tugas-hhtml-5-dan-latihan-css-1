<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
</head>
<body>

    <h2>Form Pendaftaran</h2>

    <form>
        <fieldset>
            <legend>Pendaftaran Siswa</legend>
            <table>
                <tr>
                    <td>Nama Lengkap:</td>
                    <td><input type="text" name="nama" placeholder="Masukkan nama lengkap"></td>
                </tr>
                <tr>
                    <td>NIS:</td>
                    <td><input type="text" name="nis" placeholder="Masukkan NIS"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin:</td>
                    <td>
                        <input type="radio" name="jk" value="Laki-laki"> Laki-laki
                        <input type="radio" name="jk" value="Perempuan"> Perempuan
                    </td>
                </tr>
                <tr>
                    <td>Tanggal Lahir:</td>
                    <td><input type="date" name="tgl_lahir"></td>
                </tr>
                <tr>
                    <td>Jurusan:</td>
                    <td>
                        <select name="jurusan">
                            <option value="">-- Pilih Jurusan --</option>
                            <option value="RPL">Rekayasa Perangkat Lunak</option>
                            <option value="TKJ">Teknik Komputer & Jaringan</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Alamat:</td>
                    <td><textarea name="alamat" rows="3" cols="30" placeholder="Masukkan alamat lengkap"></textarea></td>
                </tr>
                <tr>
                    <td>Foto:</td>
                    <td><input type="file" name="foto"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="checkbox" name="persetujuan"> Saya menyetujui data yang saya masukkan
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Daftar">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>

</body>
</html>
